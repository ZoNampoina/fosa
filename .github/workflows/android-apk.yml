name: Build FOSA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-verify.sh'
      - 'mobile/**'
permissions:
  contents: write
concurrency:
  group: fosa-android-release
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify-audio.yml
    with:
      android_only: true
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preserve Android debug signing identity for subsequent updates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fosa-debug-signing/debug.keystore
          key: fosa-android-debug-signing-v2
      - name: Prepare the persistent debug signing key
        env:
          FOSA_DEBUG_KEYSTORE: ${{ runner.temp }}/fosa-debug-signing/debug.keystore
        run: |
          echo "FOSA_DEBUG_KEYSTORE=$FOSA_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          if [ ! -s "$FOSA_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$FOSA_DEBUG_KEYSTORE")"
            keytool -genkeypair -keystore "$FOSA_DEBUG_KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android playback service on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: native/android
          script: bash ../../.github/scripts/android-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: native/android/app/build/reports/androidTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fosa-native-screenshots
          path: android-screenshots
      - name: Prepare named APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk FOSA-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOSA-Android-v0.14.0
          path: FOSA-Android.apk
  publish:
    needs: [verify, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FOSA-Android-v0.14.0
      - name: Publish stable Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="FOSA Mobile 0.14.0 AUDIO + HANDS-FREE: simultaneous microphone negotiation repair, real capture/RTP/decoded PCM diagnostics, explicit two-second audio test, HOLD/TAP/AUTO controls, current-network setup and real hotspot Wi-Fi QR. Physical Wi-Fi Direct and WAN-disconnected device scenarios still require validation. Web microphone/PWA require trusting this host's local certificate once. Build commit: $GITHUB_SHA. See docs/mobile/AUDIO-HANDSFREE-REPORT.md."
          if ! gh release view v0.14.0 >/dev/null 2>&1; then
            gh release create v0.14.0 FOSA-Android.apk --target "$GITHUB_SHA" --title "FOSA 0.14.0 · AUDIO + HANDS-FREE" --notes "$notes" --latest=false
          fi
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest FOSA-Android.apk --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit android-latest --title "FOSA Android v0.14.0" --notes "$notes" --latest
          else
            gh release create android-latest FOSA-Android.apk --target "$GITHUB_SHA" --title "FOSA Android v0.14.0" --notes "$notes" --latest
          fi
