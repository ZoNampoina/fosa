name: Build FOSA Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug
      - name: Prepare named APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk FOSA-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOSA-Android-v0.6.1
          path: FOSA-Android.apk
      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest FOSA-Android.apk --title "FOSA Android v0.6.1" --notes "FOSA Android local native preview. Stable download URL for in-app QR sharing." --latest
