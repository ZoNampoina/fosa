name: Build FOSA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-verify.sh'
      - 'mobile/**'
permissions:
  contents: write
concurrency:
  group: fosa-android-release
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify-audio.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preserve Android debug signing identity for subsequent updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fosa-android-debug-signing-v1
      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android playback service on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: native/android
          script: bash ../../.github/scripts/android-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: native/android/app/build/reports/androidTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fosa-native-screenshots
          path: android-screenshots
      - name: Prepare named APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk FOSA-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOSA-Android-v0.13.0
          path: FOSA-Android.apk
      - name: Publish stable Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="FOSA Mobile 0.13.0 LOCAL-FIRST PAIRING: local code discovery and signaling, native Android Wi-Fi Direct, local hotspot creation, short session/device QR, embedded local HTTPS WebApp, resume identity and local-only Opus/DTLS/SRTP. Physical Wi-Fi Direct and WAN-disconnected device scenarios still require validation. Web microphone/PWA require trusting this host's local certificate once. Build commit: $GITHUB_SHA. See docs/mobile/LOCAL-FIRST-REPORT.md."
          if ! gh release view v0.13.0 >/dev/null 2>&1; then
            gh release create v0.13.0 FOSA-Android.apk --target "$GITHUB_SHA" --title "FOSA 0.13.0 · LOCAL-FIRST PAIRING" --notes "$notes" --latest=false
          fi
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest FOSA-Android.apk --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit android-latest --title "FOSA Android v0.13.0" --notes "$notes" --latest
          else
            gh release create android-latest FOSA-Android.apk --target "$GITHUB_SHA" --title "FOSA Android v0.13.0" --notes "$notes" --latest
          fi
