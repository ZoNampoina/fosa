name: Build FOSA Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
concurrency:
  group: fosa-android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android playback service on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: native/android
          script: bash ../../.github/scripts/android-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: native/android/app/build/reports/androidTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fosa-native-screenshots
          path: android-screenshots
      - name: Prepare named APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk FOSA-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FOSA-Android-v0.11.0
          path: FOSA-Android.apk
      - name: Publish stable Android download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest FOSA-Android.apk --title "FOSA Android v0.11.0" --notes "FOSA Mobile: native LAN intercom and Compose UI; Bodypack PCM retained. Physical hotspot and audio latency require hardware validation." --latest
