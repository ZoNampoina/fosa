name: Diagnose FOSA baseline audio
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audio-baseline.yml'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-verify.sh'
      - 'mobile/**'
permissions:
  contents: write
concurrency:
  group: fosa-audio-baseline
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preserve Android debug signing identity for subsequent updates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fosa-debug-signing/debug.keystore
          key: fosa-android-debug-signing-v2
      - name: Prepare the persistent debug signing key
        env:
          FOSA_DEBUG_KEYSTORE: ${{ runner.temp }}/fosa-debug-signing/debug.keystore
        run: |
          echo "FOSA_DEBUG_KEYSTORE=$FOSA_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          if [ ! -s "$FOSA_DEBUG_KEYSTORE" ]; then
            mkdir -p "$(dirname "$FOSA_DEBUG_KEYSTORE")"
            keytool -genkeypair -keystore "$FOSA_DEBUG_KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build debug APK
        working-directory: native/android
        run: gradle assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android playback service on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: native/android
          script: bash ../../.github/scripts/android-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: native/android/app/build/reports/androidTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fosa-native-screenshots
          path: android-screenshots
