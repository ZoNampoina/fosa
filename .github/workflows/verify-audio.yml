name: Verify FOSA Audio
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r audio-bridge/requirements.txt
      - run: python -m unittest discover -s audio-bridge/tests -v
      - run: node --check network.js
      - run: node --check network-relay.js
      - run: node --check low-latency.js
      - run: node --check low-latency-worklet.js
      - run: node audio-bridge/tests/pcm_worklet.cjs
      - run: git diff --check
      - name: Parse Windows firewall helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/audio-bridge/configure-firewall.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if($errors.Count){$errors | Format-List; exit 1}
          python -c "import sys; sys.path.insert(0,'audio-bridge'); from lan import discover; print(discover())"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r audio-bridge/requirements.txt
      - run: npm install --prefix "$RUNNER_TEMP/fosa-browser" playwright@1.63.0
      - name: Verify actual HTTP audio in browsers
        env:
          NODE_PATH: ${{ runner.temp }}/fosa-browser/node_modules
          FOSA_BROWSER_OUTPUT: ${{ runner.temp }}/fosa-browser-output
        run: node audio-bridge/tests/browser_flow.cjs
      - name: Verify secure talkback through the actual signalling service
        env:
          NODE_PATH: ${{ runner.temp }}/fosa-browser/node_modules
          FOSA_BROWSER_OUTPUT: ${{ runner.temp }}/fosa-browser-output
        run: node audio-bridge/tests/secure_browser_flow.cjs
      - name: Verify PCM playback and coexistence with Opus
        env:
          NODE_PATH: ${{ runner.temp }}/fosa-browser/node_modules
          FOSA_BROWSER_OUTPUT: ${{ runner.temp }}/fosa-browser-output
        run: node audio-bridge/tests/low_latency_browser_flow.cjs
      - name: Verify direct PC operator microphone and console permissions
        env:
          NODE_PATH: ${{ runner.temp }}/fosa-browser/node_modules
          FOSA_BROWSER_OUTPUT: ${{ runner.temp }}/fosa-browser-output
        run: node audio-bridge/tests/regisseur_browser_flow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fosa-browser-verification
          path: ${{ runner.temp }}/fosa-browser-output
