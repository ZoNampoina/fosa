name: Deploy FOSA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify-audio.yml
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare versioned secure musician client
        run: |
          mkdir -p musicians/v095 musicians/v096 musicians/v097 musicians/v098
          git fetch --no-tags --depth=1 origin 987b0727540efd79ac5bc1e77a2f072efb642f40
          for asset in network.html network.js network.css network-relay.js network-relay-config.json fosa-icon.svg; do
            git show 987b0727540efd79ac5bc1e77a2f072efb642f40:"$asset" > "musicians/v095/$asset"
          done
          git fetch --no-tags --depth=1 origin 5c3fb8e82760659f87703b4e7a24add84108aafb
          for asset in network.html network.js network.css network-relay.js network-relay-config.json low-latency.js low-latency-worklet.js fosa-icon.svg; do
            git show 5c3fb8e82760659f87703b4e7a24add84108aafb:"$asset" > "musicians/v096/$asset"
          done
          git fetch --no-tags --depth=1 origin 5313e961e1d2ff126aba9820b8648cbeb800c47d
          for asset in network.html network.js network.css network-relay.js network-relay-config.json low-latency.js low-latency-worklet.js fosa-icon.svg; do
            git show 5313e961e1d2ff126aba9820b8648cbeb800c47d:"$asset" > "musicians/v097/$asset"
          done
          cp network.html network.js network.css network-relay.js network-relay-config.json low-latency.js low-latency-worklet.js fosa-icon.svg musicians/v098/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
